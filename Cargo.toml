[package]
name = "kafka-client-id3"
version = "0.1.0"
edition = "2021"

[dependencies]
rdkafka = { version = "0.37.0", features = ["tokio"] }
tokio = { version = "1.42.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
log = "0.4.27"
env_logger = "0.11"
dotenv = "0.15"
shellexpand = "3"
once_cell = "1"
regex = "1"
serde = "1"
serde_json = "1"
